<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adjust Sales Order Values</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fbfd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      background-color: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 420px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #444;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease-in-out;
    }

    button:hover {
      background-color: #0056b3;
    }

    .error-message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Manually Edit Predicted Values</h2>

    <form method="post" action="{% url 'manual_edit' %}">
      {% csrf_token %}

      <!-- Hidden fields -->
      <input type="hidden" name="customer_number" value="{{ customer_number }}">
      <input type="hidden" name="material_number" value="{{ material_number }}">
      <input type="hidden" name="quantity" value="{{ quantity }}">

      <!-- Editable fields -->
      <label for="term_of_payment">Term of Payment (in days):</label>
      <input type="number" id="term_of_payment" name="term_of_payment" value="{{ term_of_payment }}" required>

      <label for="discount">Discount %:</label>
      <input type="number" step="0.01" id="discount" name="discount" value="{{ discount }}" required>

      <label for="dunning_level">Dunning Level:</label>
      <input type="number" id="dunning_level" name="dunning_level" value="{{ dunning_level }}" required>

      <button type="submit">✅ Save & Confirm Order</button>
    </form>

    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}
  </div>

</body>
</html>
