<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Sales Order</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #004080;
      color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .header .title {
      font-size: 24px;
      font-weight: bold;
    }

    .header .subtitle {
      font-size: 16px;
      font-style: italic;
    }

    .form-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 80px);
    }

    .form-container {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #555;
      text-align: left;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s ease-in-out;
    }

    input:focus {
      border-color: #0077cc;
      box-shadow: 0 0 5px rgba(0, 119, 204, 0.5);
      outline: none;
    }

    button {
      margin-top: 20px;
      background-color: #0077cc;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease-in-out;
    }

    button:hover {
      background-color: #005fa3;
    }

    .error-message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="title">AutoSo</div>
    <div class="subtitle">An ERP Tool with AI Implementation</div>
  </div>

  <!-- Form -->
  <div class="form-wrapper">
    <div class="form-container">
      <h2>Create Sales Order</h2>

      <form method="post">
        {% csrf_token %}
       
        <label for="customer_number">Customer Number:</label>
        <input type="text" name="customer_number" value="{{ customer_number|default_if_none:'' }}" required>

        <label for="material_number">Material Number:</label>
        <input type="text" name="material_number" value="{{ material_number|default_if_none:'' }}" required>

        <label for="quantity">Quantity:</label>
        <input type="number" name="quantity" min="1" value="{{ quantity|default_if_none:'' }}" required>

        <button type="submit">Submit</button>
      </form>

      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}
    </div>
  </div>

</body>
</html>
